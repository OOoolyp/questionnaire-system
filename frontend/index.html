<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>问序 · 问卷工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><div class="loading">正在打开工作空间…</div></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script>
    // 加载失败时给出可见说明，避免只停留在“正在打开”。
    window.addEventListener('error', function (event) {
      if (document.querySelector('#app .loading')) {
        document.querySelector('#app .loading').textContent = '页面脚本加载失败：' + (event.message || '请刷新页面重试。');
      }
    });
    window.addEventListener('unhandledrejection', function (event) {
      if (document.querySelector('#app .loading')) {
        document.querySelector('#app .loading').textContent = '页面暂时无法打开：' + (event.reason?.message || '请刷新页面重试。');
      }
    });
  </script>
  <script>import("./app.js?v=2").catch(function(error){document.querySelector("#app").textContent="页面脚本加载失败："+error.message;});</script>
</body>
</html>
